name: Scheduled scrape

on:
  schedule:
    # Every 6 hours (UTC). Adjust as you like — https://crontab.guru
    - cron: "0 */6 * * *"
  workflow_dispatch: {} # lets you run it by hand from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger a scrape run and wait for it
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${API_BASE_URL:-}" ]; then
            echo "::error::Set the repository variable API_BASE_URL (Settings → Secrets and variables → Actions → Variables)"
            exit 1
          fi

          start=$(curl -sS -X POST "$API_BASE_URL/api/v1/scrape/run" \
            -H 'content-type: application/json' -d '{"run_type":"scheduled"}')
          echo "start: $start"

          run_id=$(echo "$start" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("run_id") or d.get("detail",{}).get("run_id") or "")')
          if [ -z "$run_id" ]; then
            echo "::warning::No run_id (a run may already be in progress); nothing to wait on."
            exit 0
          fi

          for _ in $(seq 1 120); do          # up to ~60 min
            sleep 30
            run=$(curl -sS "$API_BASE_URL/api/v1/scrape/run/$run_id")
            status=$(echo "$run" | python3 -c 'import sys,json; print(json.load(sys.stdin)["status"])')
            echo "status: $status"
            if [ "$status" != "running" ]; then
              echo "$run"
              [ "$status" = "failed" ] && exit 1 || exit 0
            fi
          done
          echo "::error::Timed out waiting for run $run_id"
          exit 1
