[project]
name = "job-agent-backend"
version = "0.1.0"
description = "Job Agent backend API and scrapers"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Generated migrations: keep Alembic's formatting, allow long column lines.
"alembic/versions/*" = ["E501"]
# conftest must configure the environment before importing the app.
"tests/conftest.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
