# Local development: `docker compose up --build`
# API on http://localhost:10000  (Swagger UI at /docs)
# All backend config lives in ./backend/.env (gitignored; copy from backend/.env.example).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: job_agent
    ports:
      - "55432:5432"
    volumes:
      - jobagent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      # Override: inside compose the backend talks to the `db` service, not localhost.
      DATABASE_URL: postgresql://postgres:postgres@db:5432/job_agent
      PORT: "10000"
      LOG_LEVEL: INFO
    ports:
      - "10000:10000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  jobagent_pgdata:
