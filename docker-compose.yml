# Local development: `docker compose up --build`
# API on http://localhost:10000  (Swagger UI at /docs)
# Optional email digest: put RESEND_API_KEY / NOTIFY_EMAIL in a root-level .env
# file (gitignored) and docker compose picks them up automatically.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: job_agent
    ports:
      - "55432:5432"
    volumes:
      - jobagent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/job_agent
      PORT: "10000"
      LOG_LEVEL: INFO
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      NOTIFY_EMAIL: ${NOTIFY_EMAIL:-}
      NOTIFY_FROM_EMAIL: ${NOTIFY_FROM_EMAIL:-onboarding@resend.dev}
      NOTIFY_MIN_SCORE: ${NOTIFY_MIN_SCORE:-0}
    ports:
      - "10000:10000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  jobagent_pgdata:
